<defs>
  <!-- Gradients for 3D effect -->
  <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#F05138;stop-opacity:1" />
    <stop offset="100%" style="stop-color:#E04426;stop-opacity:1" />
  </linearGradient>
  <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#D03B20;stop-opacity:1" />
