    <linearGradient id="layerGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E6BA8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E4A73;stop-opacity:1" />
    </linearGradient>
    
    <!-- Swift logo gradient -->
